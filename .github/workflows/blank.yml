name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -q ./*.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle --no-daemon -p project assembleRelease

      - name: Name the APK
        run: cp project/app/build/outputs/apk/release/app-release.apk half-hour-alarm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: half-hour-alarm
          path: half-hour-alarm.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" half-hour-alarm.apk \
            --title "المنبّه v1.${{ github.run_number }}" \
            --notes "نزّل الملف half-hour-alarm.apk على التليفون وثبّته."
